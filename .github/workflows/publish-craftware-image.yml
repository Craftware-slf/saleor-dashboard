name: Publish Craftware dashboard image (GHCR)

# Self-contained build + push of the Craftware fork dashboard to GHCR so the
# Örninn prod stack can pull it (deploy/docker-compose.prod.yml in the orninn
# repo). Uses the repo's own GITHUB_TOKEN (auto-granted packages:write for this
# org) — no external secrets, no local docker login needed.
#
# API_URL is applied at runtime by the image's nginx entrypoint
# (nginx/replace-env-vars.sh), so it is NOT baked here — the prod compose sets it.

on:
  push:
    branches: [craftware/main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: craftware-slf/saleor-dashboard

concurrency:
  group: publish-craftware-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          # Droplet is amd64; single-arch keeps the build fast.
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:craftware
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:craftware-${{ github.sha }}
          cache-from: type=gha,scope=craftware-dashboard
          cache-to: type=gha,mode=max,scope=craftware-dashboard
