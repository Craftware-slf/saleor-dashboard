server {
    listen       80;
    server_name  localhost;
    root   /app/dashboard/;

    # Vite emits content-hashed bundles (e.g. index-rk9hfPqN.js, vendor-7F4YvFRD.css)
    # whose filename changes whenever the content does — cache them hard. Matched
    # before the prefix locations below; index.html is deliberately NOT listed here,
    # so it always falls through to the no-store rule.
    location ~* ^/dashboard/(.+\.(?:js|mjs|css|woff2?|ttf|otf))$ {
        alias /app/dashboard/$1;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
        # index.html carries the runtime-injected window.__SALEOR_CONFIG__ (API_URL,
        # SALEOR_APP_BC_URL, …), patched in at container start by replace-env-vars.sh.
        # Never let a browser/proxy cache serve it stale, or runtime config silently
        # reverts to the pre-injection placeholder until the user clears their cache.
        add_header Cache-Control "no-store" always;
    }

    location /dashboard/ {
        alias /app/dashboard/;
        index  index.html;
        try_files $uri $uri/ /dashboard/index.html;
        add_header Cache-Control "no-store" always;
    }
}
